<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS-JAH503</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Librería para escanear códigos de barras -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">JEHOVA JIREH <span class="text-xs font-light text-slate-400">| POS Local</span></h1>
            
            <nav class="flex gap-2 bg-slate-800 p-1 rounded-lg">
                <button data-tab="caja" class="tab-btn px-4 py-1.5 rounded-md text-sm font-medium transition bg-blue-50/50 text-blue-600 border border-blue-600">Caja</button>
                <button data-tab="inventario" class="tab-btn px-4 py-1.5 rounded-md text-sm font-medium transition text-slate-300 hover:text-white border border-transparent">Inventario</button>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto flex-1 w-full p-4">
        
        <!-- SECCIÓN 1: CAJA / VENTA -->
        <div id="section-caja" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center">
                    <h2 class="text-lg font-semibold mb-3">📷 Lector de Códigos</h2>
                    <p class="text-xs text-slate-500 mb-4">Usa la cámara de tu dispositivo para escanear productos rápidamente.</p>
                    <button onclick="iniciarEscaner()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition shadow-md cursor-pointer">
                        Iniciar Cámara para Escanear
                    </button>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 relative">
                    <h2 class="text-lg font-semibold mb-3">🔍 Búsqueda Manual</h2>
                    <input type="text" id="busqueda-input" placeholder="Escribe el nombre del producto..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <div id="sugerencias-busqueda" class="relative"></div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex justify-between items-center">
                        <span>🛒 Carrito de Venta</span>
                        <button id="btn-vaciar" class="text-xs text-red-500 hover:text-red-700 font-medium cursor-pointer">Vaciar</button>
                    </h2>
                    
                    <div id="lista-carrito" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
                        <p class="text-slate-400 text-center py-10 text-sm">El carrito está vacío</p>
                    </div>
                </div>

                <div class="mt-6 border-t pt-4">
                    <div class="flex justify-between items-center mb-2 text-sm text-slate-600">
                        <span>Subtotal</span>
                        <span id="txt-subtotal">$0.00</span>
                    </div>
                    <div class="flex justify-between items-center mb-4 text-xl font-bold text-slate-900">
                        <span>Total a Pagar</span>
                        <span id="txt-total">$0.00</span>
                    </div>
                    <button id="btn-cobrar" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl font-semibold transition shadow-md cursor-pointer">
                        Completar Venta
                    </button>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: INVENTARIO -->
        <div id="section-inventario" class="tab-content hidden">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b bg-slate-50 flex flex-wrap justify-between items-center gap-2">
                    <h2 class="font-semibold text-slate-800">Gestión de Inventario</h2>
                    <div class="flex gap-2">
                        <button onclick="exportarInventario()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-semibold transition shadow-sm cursor-pointer">
                            💾 Exportar Copia
                        </button>
                        <label class="bg-purple-600 hover:bg-purple-700 text-white text-xs px-3 py-2 rounded-lg font-semibold transition shadow-sm cursor-pointer">
                            📁 Importar Copia
                            <input type="file" id="input-archivo-backup" accept=".json" onchange="importarInventario(event)" class="hidden">
                        </label>
                        <button onclick="abrirModalProducto()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg font-semibold transition shadow-sm cursor-pointer">
                            + Agregar Producto
                        </button>
                    </div>
                </div>
                <div id="tabla-inventario" class="divide-y divide-slate-100">
                    <!-- Dinámico por JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL PARA NUEVO / EDITAR PRODUCTO -->
    <div id="modal-producto" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 id="titulo-modal-producto" class="font-bold text-slate-800">Registrar Nuevo Producto</h3>
                <button onclick="cerrarModalProducto()" class="text-slate-400 hover:text-slate-600 font-bold px-2 py-1 cursor-pointer">✕</button>
            </div>
            <form id="form-nuevo-producto" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nombre del Producto</label>
                    <input type="text" id="input-nombre" required placeholder="Ej. Copia a Color" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Código de Barras</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-codigo" required placeholder="Ej. 7501001300010" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                        <button type="button" onclick="iniciarEscanerParaInventario()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-sm transition font-medium cursor-pointer shrink-0">
                            📷 Leer
                        </button>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Precio ($)</label>
                        <input type="number" step="0.01" id="input-precio" required placeholder="0.00" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Stock Inicial</label>
                        <input type="number" id="input-stock" required placeholder="100" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                </div>
                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="cerrarModalProducto()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-sm font-semibold transition cursor-pointer">Cancelar</button>
                    <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-semibold transition shadow-md cursor-pointer">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL FLOTANTE PARA EL ESCÁNER -->
    <div id="modal-escaner" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl p-4 flex flex-col items-center">
            <div class="flex justify-between w-full items-center mb-2">
                <h3 class="font-bold text-slate-800">Escaneando código...</h3>
                <button onclick="cerrarEscaner()" class="text-slate-400 hover:text-slate-600 font-bold px-2 py-1 cursor-pointer">✕ Cerrar</button>
            </div>
            <div id="reader-container" class="w-full rounded-lg overflow-hidden bg-black min-h-[250px]"></div>
        </div>
    </div>

    <!-- Script Principal -->
    <script src="App.js"></script>
</body>
</html>
